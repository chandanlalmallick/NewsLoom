<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Loom — 500+ Live Global Wire Headlines</title>
  <meta name="description" content="Search and read over 500 live global dispatches covering world geopolitics, AI, space exploration, silicon markets, and sports.">
  <link rel="canonical" href="https://chandanlalmallick.github.io/NewsLoom/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', sans-serif;
      --font-brand: 'Cinzel', serif;

      --bg-base: #f7f6f2;
      --bg-card: #ffffff;
      --bg-subtle: #eeece5;
      --text-main: #111215;
      --text-muted: #5e626b;
      --border: #dcd9d0;
      --accent: #c92a2a;
      --shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg-base: #0c0d10;
      --bg-card: #14161b;
      --bg-subtle: #1c1f26;
      --text-main: #f3f5f8;
      --text-muted: #9aa1ad;
      --border: #262a33;
      --accent: #ff4d4f;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-sans); line-height: 1.6; }
    .container { width: 92%; max-width: 1240px; margin: 0 auto; }

    /* Masthead */
    .masthead { background: var(--bg-card); border-bottom: 2px solid var(--text-main); padding: 14px 0 18px; }
    .masthead-top { display: flex; justify-content: space-between; font-size: 0.76rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .theme-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; color: var(--text-main); cursor: pointer; }
    .masthead-center { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; flex-wrap: wrap; gap: 16px; }
    .brand-name { font-family: var(--font-brand); font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: 0.04em; }
    
    /* Search */
    .search-wrapper { display: flex; align-items: center; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; width: 100%; max-width: 360px; }
    .search-wrapper input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 0.88rem; width: 100%; margin-left: 8px; }

    /* Nav */
    .nav-bar { background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .nav-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
    .cat-pill { background: transparent; border: none; font-size: 0.84rem; font-weight: 600; color: var(--text-muted); padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .cat-pill.active, .cat-pill:hover { background: var(--bg-subtle); color: var(--accent); }

    /* Ticker */
    .ticker-bar { background: var(--bg-subtle); border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 0.82rem; }
    .ticker-inner { display: flex; align-items: center; gap: 12px; }
    .ticker-tag { background: var(--accent); color: #fff; padding: 2px 6px; font-weight: 700; border-radius: 3px; font-size: 0.72rem; }
    .ticker-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }

    /* Grid */
    .grid-header { display: flex; justify-content: space-between; align-items: flex-end; margin: 30px 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .grid-title { font-family: var(--font-brand); font-size: 1.25rem; }
    .article-counter { font-size: 0.85rem; color: var(--accent); font-weight: 700; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .news-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
    .news-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .card-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .tag { color: var(--accent); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-title { font-family: var(--font-serif); font-size: 1.18rem; line-height: 1.35; margin: 6px 0 10px; }
    .card-desc { font-size: 0.86rem; color: var(--text-muted); flex-grow: 1; margin-bottom: 12px; }
    .meta { font-size: 0.78rem; color: var(--text-muted); }

    /* Pagination */
    .pagination { display: flex; justify-content: center; gap: 10px; margin: 40px 0; }
    .page-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Reader Drawer */
    #readerView { max-width: 800px; margin: 30px auto; display: none; }
    .back-btn { display: inline-block; margin-bottom: 20px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .reader-h1 { font-family: var(--font-serif); font-size: clamp(2rem, 3.8vw, 2.8rem); line-height: 1.2; margin: 10px 0 16px; }
    .source-link { display: inline-block; margin-top: 20px; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 4px; font-weight: 600; font-size: 0.9rem; }

    footer { border-top: 1px solid var(--border); background: var(--bg-card); padding: 30px 0; margin-top: 60px; font-size: 0.85rem; color: var(--text-muted); text-align: center; }
  </style>
</head>

<body data-theme="light">

  <header class="masthead">
    <div class="container">
      <div class="masthead-top">
        <span id="mastheadDate"></span>
        <button class="theme-btn" id="themeBtn">Dark Mode</button>
      </div>
      <div class="masthead-center">
        <div>
          <h1 class="brand-name">THE NEWS LOOM</h1>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-top:4px;">Global Intelligence Wire • 500+ Live Syndicated Reports</p>
        </div>
        <div class="search-wrapper">
          <input type="search" id="searchBox" placeholder="Search 500+ topics (AI, India, Markets, Space)...">
        </div>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="container">
      <div class="nav-scroll" id="catNav">
        <button class="cat-pill active" data-cat="all">All Dispatches</button>
        <button class="cat-pill" data-cat="world">🌍 World</button>
        <button class="cat-pill" data-cat="india">🇮🇳 India</button>
        <button class="cat-pill" data-cat="tech">🤖 AI & Tech</button>
        <button class="cat-pill" data-cat="business">📈 Markets</button>
        <button class="cat-pill" data-cat="science">🚀 Science & Space</button>
        <button class="cat-pill" data-cat="sports">🏆 Sports</button>
      </div>
    </div>
  </nav>

  <div class="ticker-bar">
    <div class="container ticker-inner">
      <span class="ticker-tag">WIRE</span>
      <span class="ticker-msg" id="tickerText">Loading 500+ global intelligence feeds...</span>
    </div>
  </div>

  <main class="container">
    <div id="homeView">
      <div class="grid-header">
        <h2 class="grid-title">Global Headlines</h2>
        <span class="article-counter" id="articleCounter">Loading articles...</span>
      </div>

      <div class="news-grid" id="newsGrid"></div>

      <div class="pagination">
        <button class="page-btn" id="prevBtn">← Previous</button>
        <span style="align-self:center;font-size:0.9rem;" id="pageIndicator">Page 1</span>
        <button class="page-btn" id="nextBtn">Next →</button>
      </div>
    </div>

    <!-- Reader Drawer -->
    <article id="readerView">
      <button class="back-btn" id="backBtn">← Return to Wire</button>
      <span class="tag" id="rTag"></span>
      <h1 class="reader-h1" id="rTitle"></h1>
      <div class="meta" id="rMeta" style="margin-bottom:20px;"></div>
      <img id="rImg" src="" alt="" style="width:100%;border-radius:8px;aspect-ratio:16/9;object-fit:cover;margin-bottom:20px;">
      <p id="rLead" style="font-size:1.2rem;line-height:1.7;font-family:var(--font-serif);"></p>
      <a id="rSource" class="source-link" href="#" target="_blank" rel="noopener noreferrer">Read Full Official Wire Report ↗</a>
    </article>
  </main>

  <footer>
    <div class="container">
      <p>© <span id="year"></span> The News Loom International. Continuously updated via automated multi-region RSS syndication.</p>
    </div>
  </footer>

  <script>
    let allArticles = [];
    let currentFiltered = [];
    let currentPage = 1;
    const pageSize = 15;
    let activeCat = "all";
    let searchQ = "";

    document.getElementById("mastheadDate").textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById("year").textContent = new Date().getFullYear();

    // Load 500+ Articles from articles.json
    async function loadFeed() {
      try {
        const res = await fetch('articles.json');
        if (!res.ok) throw new Error();
        allArticles = await res.json();
      } catch (e) {
        // Fallback live sample
        allArticles = [
          { id: "1", cat: "tech", catLabel: "AI & Frontier Tech", title: "Autonomous Reasoning Architectures Reach 98% On Formal Mathematics Benchmarks", lead: "Frontier laboratories confirm multi-stage inference verification architectures solving complex proof verification.", date: "Today", url: "https://news.google.com", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80" },
          { id: "2", cat: "india", catLabel: "India", title: "ISRO Finalizes Trajectory Matrix for Chandrayaan-4 Lunar Polar Return Mission", lead: "Dual orbital rendezvous protocols validated to retrieve sub-surface core samples from south polar fissures.", date: "Today", url: "https://news.google.com", img: "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=1000&q=80" }
        ];
      }

      if (allArticles.length > 0) {
        document.getElementById("tickerText").textContent = `${allArticles[0].catLabel}: ${allArticles[0].title}`;
      }
      filterAndRender();
    }

    function filterAndRender() {
      const q = searchQ.toLowerCase();
      currentFiltered = allArticles.filter(item => {
        const catMatch = activeCat === "all" || item.cat === activeCat;
        const textMatch = !q || item.title.toLowerCase().includes(q) || (item.lead && item.lead.toLowerCase().includes(q));
        return catMatch && textMatch;
      });

      currentPage = 1;
      renderPage();
    }

    function renderPage() {
      const grid = document.getElementById("newsGrid");
      const total = currentFiltered.length;
      document.getElementById("articleCounter").textContent = `${total} Articles Available`;

      const start = (currentPage - 1) * pageSize;
      const paginated = currentFiltered.slice(start, start + pageSize);

      if (paginated.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-muted)">No matching dispatches found.</div>`;
      } else {
        grid.innerHTML = paginated.map(item => `
          <article class="news-card" onclick="openReader('${item.id}')">
            <img class="card-img" src="${item.img}" alt="${item.title}" loading="lazy">
            <div class="card-body">
              <span class="tag">${item.catLabel}</span>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.lead || ''}</p>
              <div class="meta">${item.date}</div>
            </div>
          </article>
        `).join("");
      }

      const totalPages = Math.ceil(total / pageSize) || 1;
      document.getElementById("pageIndicator").textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages;
    }

    // Reader Mode
    window.openReader = function(id) {
      const item = allArticles.find(a => a.id === id);
      if (!item) return;

      document.getElementById("rTag").textContent = item.catLabel;
      document.getElementById("rTitle").textContent = item.title;
      document.getElementById("rLead").textContent = item.lead || item.title;
      document.getElementById("rMeta").textContent = `${item.date} • Syndicated Wire Report`;
      document.getElementById("rImg").src = item.img;
      document.getElementById("rSource").href = item.url;

      document.getElementById("homeView").style.display = "none";
      document.getElementById("readerView").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("backBtn").onclick = () => {
      document.getElementById("readerView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // Category Buttons
    document.querySelectorAll(".cat-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        filterAndRender();
      });
    });

    // Instant Search
    document.getElementById("searchBox").addEventListener("input", (e) => {
      searchQ = e.target.value.trim();
      filterAndRender();
    });

    // Pagination Click
    document.getElementById("prevBtn").onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo({ top: 400, behavior: "smooth" }); } };
    document.getElementById("nextBtn").onclick = () => { currentPage++; renderPage(); window.scrollTo({ top: 400, behavior: "smooth" }); };

    // Theme Switch
    document.getElementById("themeBtn").onclick = () => {
      const isDark = document.body.getAttribute("data-theme") === "dark";
      document.body.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("themeBtn").textContent = isDark ? "Dark Mode" : "Light Mode";
    };

    loadFeed();
  </script>
</body>
</html>
