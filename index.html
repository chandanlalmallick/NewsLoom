<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="ag3esFh04E0jMVaZcougm8vA16PAviXBEFzWP78fXoM" />

  <title>News Loom — Global Intelligence, Technology & World Affairs</title>
  <meta name="description" content="Independent global news dashboard covering artificial intelligence, quantum technology, space exploration, silicon markets, geopolitics, and world sports.">
  <link rel="canonical" href="https://chandanlalmallick.github.io/NewsLoom/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', sans-serif;
      --font-brand: 'Cinzel', serif;

      --bg-base: #f8f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #eeece5;
      --text-main: #121316;
      --text-muted: #5a5e67;
      --border: #dcdad2;
      --accent: #b82323;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] {
      --bg-base: #0d0e12;
      --bg-card: #15171d;
      --bg-subtle: #1d2028;
      --text-main: #f2f4f8;
      --text-muted: #9aa1ad;
      --border: #282c36;
      --accent: #ff4d4f;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 92%; max-width: 1240px; margin: 0 auto; }

    /* Masthead */
    .masthead {
      background: var(--bg-card);
      border-bottom: 2px solid var(--text-main);
      padding: 14px 0 20px;
    }
    .masthead-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .masthead-center {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 16px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand-name {
      font-family: var(--font-brand);
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Search & Suggestions */
    .search-container {
      position: relative;
      width: 100%;
      max-width: 400px;
    }
    .search-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      width: 100%;
      padding: 6px 8px;
    }
    .search-action-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 4px;
      max-height: 250px;
      overflow-y: auto;
      list-style: none;
      box-shadow: var(--shadow);
      z-index: 1000;
      display: none;
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--bg-subtle); color: var(--accent); }
    .suggestion-cat {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Categories Navigation */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: none;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: transparent;
      border: none;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--bg-subtle);
      color: var(--accent);
    }

    /* Live Ticker */
    .ticker-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-size: 0.82rem;
    }
    .ticker-inner { display: flex; align-items: center; gap: 12px; }
    .ticker-tag {
      background: var(--accent);
      color: #ffffff;
      padding: 2px 6px;
      font-weight: 700;
      border-radius: 3px;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }
    .ticker-msg {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Grid Header & Cards */
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin: 32px 0 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .grid-title { font-family: var(--font-brand); font-size: 1.25rem; }
    .article-counter { font-size: 0.85rem; color: var(--accent); font-weight: 700; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: var(--bg-subtle);
    }
    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .tag {
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .card-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      line-height: 1.35;
      margin: 4px 0 10px;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      flex-grow: 1;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .meta { font-size: 0.78rem; color: var(--text-muted); }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 45px 0;
    }
    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .page-btn:hover:not(:disabled) { background: var(--bg-subtle); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-indicator { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); }

    /* Reader View */
    #readerView {
      max-width: 820px;
      margin: 30px auto;
      display: none;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
    .reader-h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.18;
      margin: 10px 0 16px;
    }
    .reader-lead-text {
      font-size: 1.22rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .reader-img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      margin-bottom: 24px;
    }
    .reader-body-copy {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      line-height: 1.85;
    }
    .reader-body-copy p { margin-bottom: 22px; }

    footer {
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      padding: 40px 0;
      margin-top: 60px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      .search-container { max-width: 100%; }
    }
  </style>
</head>

      { id: 2, cat: "ai", catLabel: "Artificial Intelligence", title: "Why Retrieval-Augmented Generation Reduces AI Hallucination", desc: "An explainer on how pairing language models with external document retrieval improves factual accuracy.", loc: "Toronto, Canada", time: "4 min read", img: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=1000&q=80", p: ["Retrieval-augmented generation, or RAG, works by first searching a knowledge base or document store for passages relevant to a user's question, then feeding those passages to the language model alongside the prompt. This grounds the model's answer in retrieved text instead of relying purely on memorized patterns.", "Because the model can cite or draw directly from retrieved sources, RAG systems tend to produce fewer confidently wrong answers on niche or fast-changing topics, since the underlying data can be updated without retraining the model itself.", "The approach has become a standard building block for enterprise chatbots and search assistants, since it lets organizations plug their own private documents into a general-purpose model safely and cheaply."] },
      { id: 3, cat: "ai", catLabel: "Artificial Intelligence", title: "The Difference Between Fine-Tuning and Prompt Engineering", desc: "A comparison of two common ways developers adapt general-purpose AI models for specific tasks.", loc: "Bengaluru, India", time: "3 min read", img: "https://images.unsplash.com/photo-1591453089816-0fbb971b454c?auto=format&fit=crop&w=1000&q=80", p: ["Prompt engineering means carefully wording instructions and examples given to an already-trained model to steer its output, without changing any of the model's internal parameters. It is fast, cheap, and reversible, making it the default first step for most applications.", "Fine-tuning instead updates a model's weights using a smaller, task-specific dataset, which can produce more consistent behavior for narrow, repetitive tasks like customer support ticket classification or code review in a specific style.", "Many teams now combine both: a fine-tuned base model handles the core task reliably, while prompt engineering adjusts tone, format, and edge cases on top of it."] },
      { id: 4, cat: "ai", catLabel: "Artificial Intelligence", title: "Inside the Compute Race Behind Frontier AI Training Runs", desc: "A look at why training the largest AI models has become a contest over data-center capacity.", loc: "Santa Clara, USA", time: "5 min read", img: "https://images.unsplash.com/photo-1555255707-c07966088b7b?auto=format&fit=crop&w=1000&q=80", p: ["Training a frontier-scale language model requires running thousands of specialized processors continuously for weeks, coordinating them so that gradient updates stay synchronized across the entire cluster without stalling.", "The bottleneck is often not raw chip count but the interconnect bandwidth linking chips together, since a training run is only as fast as its slowest communication step between processors.", "This has pushed AI labs toward building or leasing dedicated data-center campuses with custom networking, turning compute procurement into as strategic a decision as the model architecture itself."] },
      { id: 5, cat: "ai", catLabel: "Artificial Intelligence", title: "What AI Alignment Research Is Actually Trying to Solve", desc: "An explainer on the technical problem of making AI systems behave as intended.", loc: "Oxford, UK", time: "5 min read", img: "https://images.unsplash.com/photo-1677442136019-21780efad99a?auto=format&fit=crop&w=1000&q=80", p: ["Alignment research studies the gap between what an AI system is trained to optimize for and what its designers actually want it to do, a gap that can produce unintended behavior even when a model performs well on its training metric.", "Techniques such as reinforcement learning from human feedback attempt to close this gap by having people rank model outputs, teaching the system a proxy for human preferences rather than a rigid rule set.", "Researchers caution that proxies are imperfect, so a major thread of current work focuses on interpretability: understanding what is actually happening inside a model rather than only judging it by its outputs."] },
